<div [appRotateBalance]="accounts" class="accounts">
  <h2>Welcome</h2>

  <ng-container *ngFor="let account of accounts">
    <div class="account-card">
      <div>{{ account.account_name }}</div>
      <div>{{ account.balance | balance }}</div>

      <button (click)="viewDetails(account)">View account details</button>
    </div>
  </ng-container>

  <app-details
    *ngIf="selectedAccount"
    [account]="selectedAccount"
    (closed)="selectedAccount = null"
  >
  </app-details>
</div>
