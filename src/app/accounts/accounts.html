<div [appRotateBalance]="accounts">
  <h2>Welcome</h2>

  <ng-container *ngFor="let account of accounts">
    <div>
      <div>{{ account.account_name }}</div>
      <div>{{ account.balance | balance }}</div>

      <button (click)="viewDetails(account)">View account details</button>
    </div>
  </ng-container>

  <app-details *ngIf="selectedAccount" [account]="selectedAccount"> </app-details>
</div>
